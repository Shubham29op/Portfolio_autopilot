# Maps Screener.in export column headers -> canonical metric names.
# Matching ignores case, spaces and punctuation. Add aliases if your export differs;
# `python -m autopilot.cli research --check FILE` prints what matched. [TBD verify on first export]
columns:
  nse_code:          ["NSE Code", "NSE Symbol", "Symbol"]
  name:              ["Name", "Company Name"]
  price:             ["CMP Rs.", "Current Price", "CMP"]
  market_cap:        ["Mar Cap Rs.Cr.", "Market Capitalization", "Market Cap"]
  sales_growth_3y:   ["Sales Var 3Yrs %", "Sales growth 3Years", "Sales Growth 3Y"]
  profit_growth_3y:  ["Profit Var 3Yrs %", "Profit growth 3Years", "Profit Growth 3Y"]
  qtr_sales_yoy:     ["Qtr Sales Var %", "YOY Quarterly sales growth"]
  qtr_profit_yoy:    ["Qtr Profit Var %", "YOY Quarterly profit growth"]
  roce:              ["ROCE %", "Return on capital employed"]
  roe:               ["ROE %", "Return on equity"]
  roe_3y_avg:        ["ROE 3Yr %", "Average return on equity 3Years"]
  opm:               ["OPM %", "OPM", "Operating profit margin"]
  opm_last_year:     ["OPM Last Year %", "OPM last year"]
  debt_to_equity:    ["Debt / Eq", "Debt to equity", "D/E"]
  interest_coverage: ["Int Coverage", "Interest Coverage Ratio", "Interest Coverage"]
  cfo_last_year:     ["CF Opr Last Yr Rs.Cr.", "Cash from operations last year"]
  pat_last_year:     ["PAT 12M Rs.Cr.", "Profit after tax last year", "Net profit"]
  pe:                ["P/E", "Price to Earning", "PE"]
  pe_5y_median:      ["Hist PE 5Yrs", "Historical PE 5Years", "Median PE 5Y"]
  industry_pe:       ["Ind PE", "Industry PE"]
  ev_ebitda:         ["EV / EBITDA", "EVEBITDA", "EV/EBITDA"]
  promoter_holding:  ["Prom. Hold. %", "Promoter holding"]
  promoter_change:   ["Chg in Prom Hold %", "Change in promoter holding"]
  pledged_pct:       ["Pledged %", "Pledged percentage"]
  fii_change:        ["Chg in FII Hold %", "Change in FII holding"]
  dii_change:        ["Chg in DII Hold %", "Change in DII holding"]
