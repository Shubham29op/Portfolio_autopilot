# Tradable universe. type drives charges (STT) and regime rules.
# ETFs are defined here. Stocks: if config/ind_nifty100list.csv (NSE download) exists,
# it REPLACES the stock list below, using NSE's Industry column as the sector.
# Sectors use NSE industry names so ETFs, stocks and research share one vocabulary.
# Stock list = large caps TODAY -> backtests carry survivorship bias.
# [TBD] verify ETF tickers on NSE before going live; extend the list freely.
